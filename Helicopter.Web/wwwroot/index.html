<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Techno kitten adventure</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>

  <script>
    (function() {
      const originalAddEventListener = EventTarget.prototype.addEventListener;
      EventTarget.prototype.addEventListener = function(type, listener, options) {
        if (typeof type === 'string' && (type.startsWith('touch') || type.startsWith('mouse') || type.startsWith('pointer'))) {
          if (typeof options === 'boolean') {
            options = { capture: options, passive: false };
          } else if (typeof options === 'object' && options !== null) {
            options.passive = false;
          } else {
            options = { passive: false };
          }
        }
        return originalAddEventListener.call(this, type, listener, options);
      };
    })();

    window.isPhysicalGamepadConnected = function() {
      try {
        const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (let i = 0; i < gamepads.length; i++) {
          if (gamepads[i] && gamepads[i].connected) {
            return true;
          }
        }
      } catch (e) {}
      return false;
    };

    window.redirectToQuitUrl = function() {
      window.location.href = "https://technokittenadventure.ca";
    };

    window._tkaAudioInstances = [];
    const origCreateElement = document.createElement;
    document.createElement = function(tagName, options) {
      const el = origCreateElement.call(document, tagName, options);
      if (tagName && tagName.toString().toLowerCase() === 'audio') {
        window._tkaAudioInstances.push(el);
      }
      return el;
    };

    const OriginalAudio = window.Audio;
    if (OriginalAudio) {
      window.Audio = function(src) {
        const audio = new OriginalAudio(src);
        window._tkaAudioInstances.push(audio);
        return audio;
      };
      window.Audio.prototype = OriginalAudio.prototype;
    }

    window.getWebAudioPlayPositionMs = function() {
      try {
        if (window._tkaAudioInstances && window._tkaAudioInstances.length > 0) {
          for (let i = window._tkaAudioInstances.length - 1; i >= 0; i--) {
            const a = window._tkaAudioInstances[i];
            if (a && !a.paused && !a.ended && !isNaN(a.currentTime) && a.currentTime >= 0) {
              const isMusic = (a.src && (a.src.includes('Music') || a.src.includes('SeaOfLove') || a.src.includes('LikeARainbow') || a.src.includes('YoureShining') || a.src.includes('TasteOfHeaven') || a.src.includes('IntergalacticalHigh') || a.src.includes('MyRainbow'))) || (!isNaN(a.duration) && a.duration > 15);
              if (isMusic) {
                return a.currentTime * 1000.0;
              }
            }
          }
          for (let i = window._tkaAudioInstances.length - 1; i >= 0; i--) {
            const a = window._tkaAudioInstances[i];
            if (a && !a.paused && !a.ended && !isNaN(a.currentTime) && a.currentTime >= 0) {
              return a.currentTime * 1000.0;
            }
          }
        }

        const audios = document.getElementsByTagName('audio');
        for (let i = 0; i < audios.length; i++) {
          const a = audios[i];
          if (a && !a.paused && !a.ended && !isNaN(a.currentTime) && a.currentTime >= 0) {
            return a.currentTime * 1000.0;
          }
        }
      } catch (e) {}
      return -1;
    };

    window.resetWebAudioToStart = function() {
      console.log("[TKA AUDIO] resetWebAudioToStart called! Resetting audio currentTime to 0...");
      try {
        if (window._tkaAudioInstances) {
          for (let i = 0; i < window._tkaAudioInstances.length; i++) {
            const a = window._tkaAudioInstances[i];
            if (a) {
              a.currentTime = 0;
            }
          }
        }
      } catch (e) {}
    };

    window.logTkaAudioInfo = function() {
      console.log("[TKA AUDIO DEBUG] Active instances count:", window._tkaAudioInstances ? window._tkaAudioInstances.length : 0);
      if (window._tkaAudioInstances) {
        window._tkaAudioInstances.forEach((a, idx) => {
          console.log(`[TKA INSTANCE #${idx}] src=${a.src}, currentTime=${a.currentTime}, duration=${a.duration}, paused=${a.paused}, ended=${a.ended}`);
        });
      }
      const domAudios = document.getElementsByTagName('audio');
      console.log("[TKA DOM] Count:", domAudios.length);
      for (let i = 0; i < domAudios.length; i++) {
        const a = domAudios[i];
        console.log(`[TKA DOM #${i}] src=${a.src}, currentTime=${a.currentTime}, duration=${a.duration}, paused=${a.paused}, ended=${a.ended}`);
      }
    };
  </script>

  <script src="_content/nkast.Wasm.Dom/js/JSObject.8.0.2.js"></script>
  <script src="_content/nkast.Wasm.Dom/js/Window.8.0.2.js"></script>
  <script src="_content/nkast.Wasm.Dom/js/Document.8.0.2.js"></script>
  <script src="_content/nkast.Wasm.Dom/js/Navigator.8.0.2.js"></script>
  <script src="_content/nkast.Wasm.Dom/js/Gamepad.8.0.2.js"></script>
  <script src="_content/nkast.Wasm.Dom/js/Media.8.0.2.js"></script>
  <script src="_content/nkast.Wasm.Canvas/js/Canvas.8.0.2.js"></script>
  <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.8.0.2.js"></script>
  <script src="_content/nkast.Wasm.Audio/js/Audio.8.0.2.js"></script>
  <script src="_content/nkast.Wasm.XHR/js/XHR.8.0.2.js"></script>

</head>

<body>
  <canvas id="theCanvas" tabindex="1" width="1280" height="720"></canvas>
  <script>
    window.redirectToQuitUrl = function() {
        window.location.href = "https://technokittenadventure.ca";
    };
    console.log("DEBUG: JS loop started!");
    let frameCount = 0;
    function myLoop() {
        frameCount++;
        if (frameCount % 60 === 0) console.log("DEBUG: JS requestAnimationFrame is alive! Frame: " + frameCount);
        window.requestAnimationFrame(myLoop);
    }
    window.requestAnimationFrame(myLoop);

    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('theCanvas');
      if (canvas) {
        canvas.focus();
        console.log("DEBUG: Canvas focused on DOMContentLoaded");
      }
    });
    window.addEventListener('click', () => {
      const canvas = document.getElementById('theCanvas');
      if (canvas) {
        canvas.focus();
        console.log("DEBUG: Canvas focused on click");
      }
    });

    window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error("JS CRASH: ", msg, url, lineNo, columnNo, error);
        return false;
    };
    window.onunhandledrejection = function(event) {
        if (event && event.reason && (event.reason.name === 'NotAllowedError' || (typeof event.reason.message === 'string' && (event.reason.message.includes('interact') || event.reason.message.includes('user'))))) {
            console.warn("Web Audio autoplay waiting for user interaction.");
            if (event.preventDefault) event.preventDefault();
            return true;
        }
        console.error("JS PROMISE REJECTION: ", event.reason);
    };
  </script>
  <script src="_framework/blazor.webassembly.js" autostart="true"></script>
</body>

</html>
