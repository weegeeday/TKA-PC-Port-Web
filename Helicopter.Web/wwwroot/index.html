<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Kitten Attacks</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module">
    // Load the .NET 8 WASM runtime and start the app.
    // The _framework/dotnet.js entry point is generated by dotnet publish.
    import { dotnet } from './_framework/dotnet.js';

    const { setModuleImports, getAssemblyExports, getConfig } = await dotnet
      .withDiagnosticTracing(false)
      .create();

    await dotnet.run();
  </script>
</body>
</html>
